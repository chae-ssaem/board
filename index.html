<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 칠판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  --ink:#3a3446; --muted:#6b6478; --muted2:#5f586c; --paper:#fffdf8; --page:#fbf8f1; --line:#e6dfd0; --dash:#e3dccb;
  --desk:#e8e3f3; --lav:#e4d4f4; --lavL:#efe5f9; --lavD:#463a73; --lavM:#9b84d1; --ring:#b9b2c8;
  --pink:#f7c6c7; --pinkL:#fbdcdc; --memo:#ffd6e3; --pinkD:#9a2659; --rose:#f3a9b8;
  --mint:#c8e6d6; --mintL:#e1f2e8; --mintD:#24513d; --yel:#fde6a8; --yelL:#fff2cc; --yelD:#6a4b0c; --hl:#ffe08a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--desk);overflow:hidden;font-family:'Gowun Dodum',sans-serif;color:var(--ink);word-break:keep-all;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
.pen{font-family:'Nanum Pen Script',cursive}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--k,1));transform-origin:center;overflow:hidden;background:var(--desk)}
.desk{position:absolute;inset:0;padding:30px 64px 24px 30px;display:flex}
.idx{position:absolute;right:16px;top:100px;display:flex;flex-direction:column;gap:10px;z-index:2}
.idx button{width:60px;height:108px;border:none;border-radius:0 14px 14px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 0 0 8px;box-shadow:3px 4px 8px rgba(70,58,115,.12);transition:transform .2s,box-shadow .2s}
.idx button span{writing-mode:vertical-rl;font-size:18px;letter-spacing:2px}
.idx button.on{transform:translateX(5px);box-shadow:4px 6px 14px rgba(70,58,115,.25)}
.idx button{position:relative}
.idx button.live::after{content:'';position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:#9a2659;box-shadow:0 0 0 3px rgba(255,255,255,.8)}
.tool{position:absolute;right:86px;width:330px;z-index:45;padding:18px 20px 16px;border-radius:2px 2px 20px 2px;box-shadow:0 16px 32px rgba(70,58,115,.3);transform:rotate(-1deg);display:flex;flex-direction:column;gap:10px;animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(30px) rotate(-1deg);opacity:0}}
.tool .x{position:absolute;top:8px;right:8px;width:40px;height:40px;border:none;background:transparent;font-size:22px;color:var(--muted2)}
.tool .lab{font-size:14px;color:var(--muted2)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips button{min-height:42px;padding:0 14px;border-radius:21px;border:1.5px solid rgba(58,52,70,.15);background:rgba(255,253,248,.75);font-size:16px}
.tchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tgo{min-height:52px;border:none;border-radius:16px;font-size:19px;color:#fff;background:var(--ink)}
.tstep{display:flex;align-items:center;gap:8px}
.tstep button{width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(58,52,70,.15);background:rgba(255,253,248,.75);font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.tstep input{width:90px;height:48px;border:1.5px solid rgba(58,52,70,.2);border-radius:12px;background:var(--paper);text-align:center;font-size:24px}
.ovx{position:absolute;top:10px;right:12px;min-height:36px;padding:0 12px;border-radius:18px;border:1.5px solid rgba(58,52,70,.18);background:rgba(255,253,248,.8);font-size:14px;color:var(--muted2);z-index:2}
.brand{position:absolute;right:16px;bottom:22px;writing-mode:vertical-rl;font-size:12px;letter-spacing:2px;color:var(--muted)}
.page{position:relative;flex:1;border-radius:14px;box-shadow:0 14px 30px rgba(70,58,115,.22);background-color:var(--page);background-image:linear-gradient(#ebe5d8 1px,transparent 1px),linear-gradient(90deg,#ebe5d8 1px,transparent 1px);background-size:22px 22px;padding:26px 28px 20px;display:grid;grid-template-columns:290px minmax(0,1fr) 290px;grid-template-rows:56px minmax(0,1fr) 188px;gap:16px 24px}
.rings{position:absolute;top:-14px;left:40px;right:40px;display:flex;justify-content:space-between;pointer-events:none}
.rings i{width:12px;height:26px;border-radius:7px;border:3px solid var(--ring);background:#f1eef7}
.card{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 4px 10px rgba(70,58,115,.08)}
.tape{position:absolute;top:-11px;width:100px;height:22px;left:50%;margin-left:-50px;opacity:.95}
.t-pink{background:repeating-linear-gradient(45deg,#f7c6c7 0 8px,#fbdcdc 8px 16px)}
.t-mint{background:repeating-linear-gradient(45deg,#c8e6d6 0 8px,#e1f2e8 8px 16px)}
.t-yel{background:repeating-linear-gradient(45deg,#fde6a8 0 8px,#fff2cc 8px 16px)}
.t-lav{background:repeating-linear-gradient(45deg,#e4d4f4 0 8px,#f1e8fa 8px 16px)}
.h{font-family:'Nanum Pen Script',cursive;font-size:32px;line-height:1}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:0 14px 0 10px;height:40px;white-space:nowrap}
.muted{color:var(--muted)}
.muted2{color:var(--muted2)}
.row{display:flex;align-items:center;gap:12px;padding:0 4px;border-bottom:1.5px dashed var(--dash)}
.dot{border-radius:50%;flex-shrink:0;display:inline-block}
.badge{font-size:12px;padding:1px 8px;border-radius:12px}

/* 머리줄 */
.hdr{grid-column:1/-1;display:flex;align-items:center;gap:16px;min-width:0}
.title{position:relative;white-space:nowrap}
.title::before{content:'';position:absolute;left:-10px;right:-10px;top:20px;height:24px;background:repeating-linear-gradient(45deg,#f7c6c7 0 10px,#fbdcdc 10px 20px);opacity:.9;transform:rotate(-2deg)}
.title span{position:relative;font-size:54px;line-height:1}
.jar{position:relative;width:26px;height:34px}
.jar b{position:absolute;left:7px;top:0;width:12px;height:5px;border-radius:2px;background:var(--ring)}
.jar i{position:absolute;left:1px;top:5px;width:24px;height:29px;border:2px solid var(--ring);border-radius:6px 6px 9px 9px;overflow:hidden;background:var(--paper)}
.jar i u{position:absolute;left:0;right:0;bottom:0;background:var(--yel);transition:height .6s}

/* 시간표 */
.tt{padding:24px 18px 12px;display:flex;flex-direction:column}
#tt{flex:1;min-height:0;overflow:hidden}
.tt .row{height:38px}
.tt .num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.tt .sub{font-size:22px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chg{margin-left:auto;font-size:12px;background:#fff;border:1.5px solid #b0306a;color:#9a2659;padding:1px 8px;border-radius:12px;white-space:nowrap}

/* 가운데 */
.mid{position:relative;display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
.now{height:56px;padding:0 20px;display:flex;align-items:center;gap:12px}
.now .n{width:40px;height:40px;border-radius:50%;background:var(--yel);display:flex;align-items:center;justify-content:center;flex-shrink:0;transform:rotate(-8deg);font-size:30px;color:var(--yelD)}
.panel{flex:1;min-height:0;padding:20px 20px 14px;display:flex;flex-direction:column}
.tab{font-size:13px;padding:4px 12px;border-radius:14px;border:1.5px dashed var(--ring);color:var(--muted2);background:transparent;min-height:30px}
.tab.on{background:var(--lav);color:var(--lavD);border-color:var(--lav)}
.cols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;margin-top:12px;min-height:0}
.lbl{font-size:14px;color:var(--muted)}
.namechip{font-size:19px;background:#fbe1e2;padding:4px 14px;border-radius:16px}
.memo{background:var(--yelL);padding:8px 12px;border-radius:4px;transform:rotate(-1deg);box-shadow:0 3px 6px rgba(106,75,12,.12);font-size:16px;line-height:1.5}
.zone{font-size:13px;padding:2px 10px;border-radius:10px;flex-shrink:0;min-width:56px;text-align:center}
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.roles div{height:42px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;overflow:hidden}
.empty{color:var(--muted);font-size:15px;margin-top:14px}

/* 가운데 덮개(호출·타이머·뽑기·소음·아침·쉬는 시간) */
.ov{position:absolute;left:-12px;right:-12px;top:62px;bottom:-10px;display:flex;flex-direction:column;justify-content:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.ov.flat{left:0;right:0;top:70px;bottom:0;animation:fade .3s}
@keyframes pop{from{transform:translateY(30px) rotate(-4deg) scale(.9);opacity:0}}
@keyframes fade{from{opacity:0}}
.call{background:var(--memo);padding:22px 28px 16px;border-radius:2px 2px 22px 2px;transform:rotate(-1.5deg);box-shadow:0 16px 30px rgba(120,40,80,.32)}
.call .clip{position:absolute;top:-16px;left:34px;width:18px;height:48px;border-radius:9px;border:3px solid #9a93ad}
.call .who{font-size:64px;line-height:1;margin-top:8px}
.call .where{font-size:50px;line-height:1}
.btn-go{align-self:flex-end;margin-top:10px;font-size:17px;color:#fff;background:var(--pinkD);border:none;border-radius:22px;padding:10px 22px;min-height:44px}
.timer{background:var(--lavL);border:2px solid #cbb8ea;padding:22px 30px;border-radius:18px;transform:rotate(-.8deg);box-shadow:0 16px 30px rgba(70,58,115,.28);align-items:center;gap:6px}
.bar{width:100%;height:18px;border-radius:9px;background:var(--paper);border:1.5px solid #cbb8ea;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,#b9a2e3 0 10px,#c9b6ec 10px 20px);transition:width 1s linear}
.pick{background:var(--yelL);border:2px solid #f0d58a;padding:20px 30px;border-radius:18px;transform:rotate(.8deg);box-shadow:0 16px 30px rgba(106,75,12,.25);align-items:center;gap:10px}
.cardstack{position:relative;width:240px;height:150px;margin:12px 0 18px}
.cardstack i{position:absolute;inset:0;border-radius:14px}
.cardstack .front{background:var(--paper);border:2px solid var(--pink);box-shadow:0 8px 16px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center}
.noise{background:var(--paper);border:2px solid var(--line);padding:16px 26px;border-radius:18px;box-shadow:0 16px 30px rgba(70,58,115,.22);align-items:center;gap:10px;text-align:center;overflow:hidden}
.lights{display:flex;gap:18px;background:var(--ink);padding:12px 22px;border-radius:60px}
.lights i{width:70px;height:70px;border-radius:50%;opacity:.35;transition:all .3s}
.lights i.on{opacity:1}
.question{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:16px 26px 18px;box-shadow:0 4px 10px rgba(70,58,115,.08);gap:10px;justify-content:flex-start}
.ribbon{align-self:center;display:flex;align-items:center;gap:8px;background:var(--pink);color:#5a1f28;font-size:17px;padding:6px 22px;border-radius:4px;margin-top:-30px;box-shadow:0 4px 8px rgba(120,40,80,.18)}
.brk{background:var(--mintL);border:2px solid #a8d8c0;border-radius:14px;padding:18px 28px;box-shadow:0 8px 18px rgba(36,81,61,.15);flex-direction:row;align-items:center;gap:26px}
.brk .box{background:var(--paper);border-radius:10px;padding:10px 14px}

/* 급식 */
.meal{padding:24px 18px 14px;display:flex;flex-direction:column}
#meal{flex:1;min-height:0;overflow:hidden}
.meal .row{height:42px}

/* 아래 띠 */
.bottom{grid-column:1/-1;padding:14px 18px 16px;display:flex;flex-direction:column;min-height:0}
.week{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;min-height:0}
.wday{border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;overflow:hidden;background:var(--page);border:1.5px dashed var(--dash)}
.wday.today{background:var(--lavL);border:1.5px solid #cbb8ea}
.ev{display:flex;align-items:center;gap:6px;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd{font-size:15px;padding:4px 12px;border-radius:14px;white-space:nowrap}
.checkbox{border:2px solid var(--rose)}
.kids{display:grid;gap:8px 7px}
.kid{position:relative;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;border:2px dashed #a49cb3;background:transparent;color:var(--muted2);padding:0;transition:transform .15s}
.kid:active{transform:scale(.94)}
.kid.done{border:2px solid transparent;color:var(--ink)}
.kid .stamp{position:absolute;right:-6px;top:-8px;width:28px;height:28px;border-radius:50%;border:2px solid #c8453c;background:rgba(255,253,248,.85);color:#b0352d;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;animation:stamp .35s ease-out}
@keyframes stamp{from{transform:scale(2.2) rotate(-20deg);opacity:0}}
.prog{width:200px;height:12px;border-radius:6px;background:#f1eef7;overflow:hidden}
.prog i{display:block;height:100%;background:var(--rose);transition:width .4s}
.todo{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--page);border:1.5px dashed var(--dash);text-align:left}
.todo.done{background:var(--lavL);border:1.5px solid var(--lavL)}
.tick{width:30px;height:30px;border-radius:50%;border:2px dashed #a49cb3;display:flex;align-items:center;justify-content:center}
.todo.done .tick{background:var(--lavM);border:none}

/* 톱니 메뉴·알림 */
.gear{position:absolute;left:8px;bottom:6px;width:40px;height:40px;border-radius:50%;border:none;background:transparent;opacity:.45;display:flex;align-items:center;justify-content:center}
.gear:hover{opacity:1}
.menu{position:absolute;left:12px;bottom:52px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 10px 24px rgba(70,58,115,.25);padding:8px;display:flex;flex-direction:column;gap:4px;z-index:30;min-width:200px}
.menu button{border:none;background:transparent;text-align:left;font-size:16px;padding:10px 14px;border-radius:10px;min-height:44px}
.menu button:hover{background:var(--lavL)}
.toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:20px;font-size:16px;z-index:60;animation:fade .3s}
.netwarn{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:#fff1d6;color:#8a4b00;border:1.5px solid #e8a33c;padding:3px 14px;border-radius:14px;font-size:13px;z-index:20}

/* 전체 덮개(시작·마법사·QR) */
.full{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(232,227,243,.92)}
.sheet{width:820px;max-height:680px;background:var(--page);background-image:linear-gradient(#ebe5d8 1px,transparent 1px),linear-gradient(90deg,#ebe5d8 1px,transparent 1px);background-size:22px 22px;border-radius:16px;box-shadow:0 18px 40px rgba(70,58,115,.3);padding:30px 40px;display:flex;flex-direction:column;gap:14px;position:relative}
.steps{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.steps i{width:28px;height:28px;border-radius:50%;border:2px solid var(--ring);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;background:var(--paper)}
.steps i.on{background:var(--lavM);color:#fff;border-color:var(--lavM)}
.steps i.ok{background:var(--lav);border-color:var(--lav);color:var(--lavD)}
.steps s{flex:0 0 36px;height:2px;background:var(--ring);text-decoration:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:15px}
.inp{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
textarea.inp{resize:none;line-height:1.5}
.help{font-size:13px;color:var(--muted);line-height:1.5}
.btn{border:none;border-radius:14px;padding:12px 22px;font-size:17px;min-height:48px;background:var(--lav);color:var(--lavD)}
.btn.main{background:var(--lavM);color:#fff}
.btn.pink{background:var(--pinkD);color:#fff}
.btn.ghost{background:transparent;border:1.5px dashed var(--ring);color:var(--lavD)}
.btn:disabled{opacity:.45}
.nav{display:flex;gap:10px;justify-content:flex-end;margin-top:auto}
.list{border:1.5px solid var(--line);border-radius:10px;background:var(--paper);overflow:auto}
.opt{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1.5px dashed var(--dash);font-size:15px;min-height:44px;width:100%;border-left:none;border-right:none;border-top:none;background:transparent;text-align:left}
.opt.on{background:var(--lavL)}
.err{color:#9a2659;font-size:14px}
.ok{color:var(--mintD);font-size:14px}
.qrbox{background:#fff;padding:12px;border-radius:12px;border:1.5px solid var(--line);display:flex}
.qrbox svg{width:220px;height:220px}
.splash{cursor:pointer;flex-direction:column;gap:18px;text-align:center}
.demo{position:absolute;right:70px;bottom:10px;z-index:40;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 10px 24px rgba(70,58,115,.25);padding:10px;display:grid;grid-template-columns:repeat(2,auto);gap:6px;font-size:13px}
.demo b{grid-column:1/-1;font-weight:400;color:var(--muted)}
.demo button{border:1.5px solid var(--line);background:var(--page);border-radius:10px;padding:6px 10px;min-height:36px;font-size:13px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="desk" id="desk">
    <div class="idx" id="idx"></div>
    <div class="brand">CHAESSAEM</div>

    <div class="page">
      <div class="rings" id="rings"></div>

      <div class="hdr">
        <div class="title"><span class="pen" id="title">우리 반 칠판</span></div>
        <div class="chip" id="stars" style="margin-left:8px"></div>
        <div class="chip" id="weather" style="margin-left:auto;display:none;padding-right:8px"></div>
        <div style="display:flex;align-items:baseline;gap:16px;margin-left:10px;white-space:nowrap">
          <span class="pen" style="font-size:44px;line-height:1" id="date"></span>
          <span class="pen" style="font-size:48px;line-height:1;color:#6a5a9e" id="clock"></span>
        </div>
      </div>

      <div class="card tt">
        <div class="tape t-pink" style="transform:rotate(-3deg)"></div>
        <div class="h" style="margin-bottom:6px" id="ttTitle">오늘 시간표</div>
        <div id="tt"></div>
      </div>

      <div class="mid">
        <div class="card now" id="now"></div>
        <div class="card panel" id="panel"></div>
        <div id="ov"></div>
      </div>

      <div class="card meal">
        <div class="tape t-mint" style="transform:rotate(2deg)"></div>
        <div class="h" style="margin-bottom:6px">오늘의 급식</div>
        <div id="meal"></div>
      </div>

      <div class="card bottom" id="bottom"></div>
    </div>
  </div>

/* ================= 시간 계산 ================= */
function lessonsToday(d = new Date()) {
  const di = d.getDay() - 1;
  if (!st.tt || di < 0 || di > 4) return [];
  return (st.tt.days[di] || []).filter((l) => l.subject);
}
function periodStarts(count) {
  const a = st.settings?.auto || {};
  const cls = Number(a.classMins) || 45;
  let times = (st.tt?.times || []).map(minutesOf).filter((x) => x !== null);
  if (times.length < count) {
    let t = minutesOf(a.firstStart) ?? 540;
    times = [];
    for (let i = 0; i < count; i++) { times.push(t); t += cls + 10 + (i === 3 ? 50 : 0); }
  }
  return times.slice(0, count).map((s) => ({ start: s, end: s + cls }));
}
const shown = (k) => st.settings?.show?.[k] !== false; // 오늘의 질문·칭찬 별·1인1역 켜기/끄기
function computePhase(d = new Date()) {
  if (st.forcePhase) return st.forcePhase;
  const day = d.getDay();
  if (day === 0 || day === 6) return { phase: 'weekend' };
  const L = lessonsToday(d);
  if (!L.length) return { phase: 'nolesson' };
  const P = periodStarts(L.length);
  const now = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  const ms = minutesOf(st.settings?.auto?.morningStart) ?? 480;
  if (now < ms) return { phase: 'before' };
  if (now < P[0].start) return { phase: 'morning', next: 0, at: P[0].start };
  for (let i = 0; i < P.length; i++) {
    if (now >= P[i].start && now < P[i].end) return { phase: 'class', p: i };
    if (i + 1 < P.length && now >= P[i].end && now < P[i + 1].start) {
      return { phase: 'break', next: i + 1, at: P[i + 1].start, lunch: P[i + 1].start - P[i].end >= 30 };
    }
  }
  const lastEnd = P[P.length - 1].end;
  const close = Number(st.settings?.auto?.closingMins) || 30;
  if (now >= lastEnd && now < lastEnd + close) return { phase: 'closing', end: lastEnd + close };
  return { phase: 'after' };
}

  } else wEl.style.display = 'none';
}

    return;
  }
  if (!L.length) { $('#tt').innerHTML = '<div class="empty">오늘은 수업이 없어요</div>'; return; }
  const cur = ph.phase === 'class' ? ph.p : ph.phase === 'break' || ph.phase === 'morning' ? ph.next : -1;
  $('#tt').innerHTML = L.slice(0, 8).map((l, i) => `

    </div>`).join('') + (st.tt.source === 'neis' ? '<div class="help" style="margin-top:6px">NEIS 시간표로 보여 주는 중</div>' : '');
}

function renderNow() {
  const ph = st.phase;
  const L = lessonsToday();
  let n = '·', label = '', main = '', next = '';
  if (ph.phase === 'class') {
    n = ph.p + 1; label = '지금은'; main = `${ph.p + 1}교시 ${L[ph.p]?.subject || ''}`;
    next = L[ph.p + 1] ? `다음 · ${ph.p + 2}교시 ${L[ph.p + 1].subject}` : '마지막 시간이에요';
  } else if (ph.phase === 'break') {
    n = ph.lunch ? '밥' : '쉼'; label = ph.lunch ? '점심시간' : '쉬는 시간';
    main = `다음은 ${ph.next + 1}교시 ${L[ph.next]?.subject || ''}`; next = `${fromMinutes(ph.at)} 시작`;
  } else if (ph.phase === 'morning') {
    n = '1'; label = '곧 시작'; main = `1교시 ${L[0]?.subject || ''}`; next = `${fromMinutes(ph.at)} 시작`;

}

/* ================= 소리 ================= */
function unlockAudio() {
  try {
    st.audio = st.audio || new (window.AudioContext || window.webkitAudioContext)();
    st.audio.resume();
    if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
  } catch { /* 소리 장치 없음 */ }
}
function tone(freq, at, dur, vol = 0.35) {
  const a = st.audio;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g).connect(a.destination);
  o.start(at); o.stop(at + dur + 0.05);
}
function chime(times = 1) {
  if (!st.audio) return 0;
  const t0 = st.audio.currentTime + 0.05;
  for (let i = 0; i < times; i++) { tone(659.3, t0 + i * 1.2, 0.9); tone(523.3, t0 + i * 1.2 + 0.45, 1.1); }
  return times * 1200 + 400;
}
function pop() {
  if (!st.audio) return;
  const t = st.audio.currentTime + 0.01;
  tone(880, t, 0.15, 0.2); tone(1320, t + 0.07, 0.18, 0.15);
}
function speak(text, repeat = 2) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const voice = speechSynthesis.getVoices().find((v) => /ko/i.test(v.lang));
  for (let i = 0; i < repeat; i++) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 0.92; u.pitch = 1.05;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }
}
function announceCall(c) {
  if (c.sound === 'mute') return;
  const wait = chime(c.sound === 'chime' ? 3 : 2);
  if (c.sound === 'voice') {
    const t = callText(c.names || [], c.place || '교무실', c.message);
    setTimeout(() => speak(`${t.who} ${t.where}`, 2), wait);
  }
}

function startPickAnim(o) {
  clearInterval(st.pickAnim);
  const kids = st.settings?.students || [];
  const seen = Date.now() - (tsMs(o.at) || Date.now());
  const show = () => { $('#pNo') && ($('#pNo').textContent = o.no ? `${o.no}번` : ''); $('#pName') && ($('#pName').textContent = o.name || ''); $('#pMsg') && ($('#pMsg').textContent = o.left != null ? `뽑힌 친구는 다음 뽑기에서 빠져요 · 남은 ${o.left}명` : ''); };
  if (seen > 4000 || kids.length < 2) { show(); return; }
  let n = 0;
  st.pickAnim = setInterval(() => {
    const k = kids[Math.floor(Math.random() * kids.length)];
    if ($('#pName')) { $('#pName').textContent = k.name; $('#pNo').textContent = `${k.no}번`; }
    if (n % 3 === 0) pop();
    if (++n > 18) { clearInterval(st.pickAnim); show(); chime(1); }
  }, 90);
}

/* ================= 소음 신호등 ================= */
async function startNoise(o) {
  stopNoise();
  const n = { stream: null, raf: 0, level: 0, greenSince: Date.now(), o };
  st.noise = n;
  try {
    n.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
    unlockAudio();
    const src = st.audio.createMediaStreamSource(n.stream);
    const an = st.audio.createAnalyser();
    an.fftSize = 1024;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    const sens = Number(o.sens) || 3; // 1(둔감)~5(민감)
    const loop = () => {
      if (st.noise !== n) return;
      an.getFloatTimeDomainData(buf);
      let sum = 0;
      for (const v of buf) sum += v * v;
      const db = 20 * Math.log10(Math.sqrt(sum / buf.length) + 1e-9) + 100; // 대략 0~100
      n.level = n.level * 0.9 + db * 0.1;
      const y = 62 - sens * 3, r = 74 - sens * 3;
      const lv = n.level < y ? 'g' : n.level < r ? 'y' : 'r';
      if (n.lv !== lv) {
        n.lv = lv;
        ['g', 'y', 'r'].forEach((k) => { const el = $(`#n${k.toUpperCase()}`); if (el) { el.classList.toggle('on', k === lv); el.style.boxShadow = k === lv ? `0 0 34px ${el.style.background}` : ''; } });
        const m = $('#nMsg');
        if (m) m.textContent = lv === 'g' ? '아주 좋아요, 조용히 집중 중!' : lv === 'y' ? '조금 시끄러워요, 목소리를 줄여 볼까요?' : '너무 시끄러워요! 잠깐 멈춰요';
        if (lv !== 'g') n.greenSince = Date.now();
      }
      if (lv === 'g' && shown('stars') && Date.now() - n.greenSince >= 10 * 60 * 1000) {
        n.greenSince = Date.now();
        st.store.update({ 'stars.count': inc(1) });
        toast('초록불 10분 성공! 칭찬 별 +1');
      }
      n.raf = requestAnimationFrame(loop);
    };
    loop();
  } catch {
    const m = $('#nMsg');
    if (m) m.textContent = '마이크를 쓸 수 없어요';
    const s = $('#nSub');
    if (s) s.textContent = '브라우저 주소창 옆에서 마이크 권한을 허용해 주세요';
  }
}
function stopNoise() {
  const n = st.noise;
  if (!n) return;
  cancelAnimationFrame(n.raf);
  n.stream?.getTracks().forEach((t) => t.stop());
  st.noise = null;
}

/* ================= 자동 처리(아침 등교 체크·지난 체크 정리) ================= */
async function autoTasks() {
  const s = st.settings;
  if (!s || !st.store) return;
  const ph = st.phase.phase;
  const tk = todayKey();
  const chk = st.live.check;
  if (ph === 'morning' && s.auto?.attendance !== false && st.live.autoAttendDate !== tk && (!chk || chk.date !== tk) && (s.students || []).length) {
    await st.store.update({
      autoAttendDate: tk,
      check: { id: randomId(8), title: '등교했으면 내 이름 꾹!', stamp: '등교', kind: 'attendance', auto: true, date: tk, done: {}, startedAt: NOW }
    });
    return;
  }
  // 아침이 끝나면 자동 등교 체크를 기록으로 넘기고 닫아요
  if (chk && chk.auto && chk.kind === 'attendance' && (ph !== 'morning' || chk.date !== tk) && !st.forcePhase && st.closingCheck !== chk.id) {
    st.closingCheck = chk.id;
    await archiveCheck(chk);
  }
}
async function archiveCheck(chk) {
  const kids = st.settings?.students || [];
  const done = chk.done || {};
  await st.store.archiveCheck({
    title: chk.title || '', stamp: chk.stamp || '', date: chk.date || todayKey(),
    done: kids.filter((k) => done[k.no]).map((k) => `${k.no} ${k.name}`),
    missing: kids.filter((k) => !done[k.no]).map((k) => `${k.no} ${k.name}`)
  });
  await st.store.update({ check: null });
}

const WMO = (c) => (c === 0 ? '맑음' : c <= 2 ? '구름 조금' : c === 3 ? '흐림' : c <= 48 ? '안개' : c <= 57 ? '이슬비' : c <= 67 ? '비' : c <= 77 ? '눈' : c <= 82 ? '소나기' : c <= 86 ? '눈' : '뇌우');
function airGrade(pm10, pm25) {
  const g10 = pm10 == null ? 0 : pm10 <= 30 ? 0 : pm10 <= 80 ? 1 : pm10 <= 150 ? 2 : 3;
  const g25 = pm25 == null ? 0 : pm25 <= 15 ? 0 : pm25 <= 35 ? 1 : pm25 <= 75 ? 2 : 3;

async function loadWeather() {
  if (st.store?.demo) return;
  const region = st.settings?.school?.region || '';
  const key = Object.keys(REGIONS).find((k) => region.startsWith(k));
  if (!key) return;
  const [lat, lon] = REGIONS[key];
  try {
    const [w, a] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=Asia%2FSeoul`).then((r) => r.json()),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm10,pm2_5&timezone=Asia%2FSeoul`).then((r) => r.json()).catch(() => null)
    ]);
    st.weather = {
      code: w.current.weather_code, temp: w.current.temperature_2m, text: WMO(w.current.weather_code),
      air: a?.current ? airGrade(a.current.pm10, a.current.pm2_5) : null
    };
  } catch { st.weather = null; }
  renderHeader();
}

let refreshTimers = [];
function startStore(store) {
  st.store = store;
  let gotSettings = false;
  store.onSettings((s) => {
    const prev = st.settings;
    st.settings = s;
    if (!s) { toast('설정을 찾을 수 없어요. 처음 설정을 다시 해 주세요.'); openWizard(); return; }
    const changed = !prev || JSON.stringify([prev.school, prev.grade, prev.cls, prev.relay]) !== JSON.stringify([s.school, s.grade, s.cls, s.relay]);
    if (changed) { loadTimetable(); loadMeal(); loadSchedule(); loadWeather(); }
    gotSettings = true;
    renderAll();
  }, (e) => netError(e));
  store.onLive((l) => {
    st.live = l || {};
    st.online = true; $('#net').innerHTML = '';
    const c = st.live.call;
    if (c && c.id && c.id !== st.lastCallId) {
      const fresh = !tsMs(c.at) || Date.now() - tsMs(c.at) < 60000;
      if (st.lastCallId !== null && fresh && !c.ack) announceCall(c);
      st.lastCallId = c.id;
    } else if (!c) st.lastCallId = st.lastCallId ?? '';
    renderAll();
    if (gotSettings) autoTasks();
  }, (e) => netError(e));
  refreshTimers.forEach(clearInterval);
  refreshTimers = [
    setInterval(loadTimetable, 10 * 60 * 1000),
    setInterval(loadMeal, 60 * 60 * 1000),
    setInterval(loadSchedule, 3 * 60 * 60 * 1000),
    setInterval(loadWeather, 30 * 60 * 1000)
  ];
}
function netError(e) {
  console.warn(e);
  st.online = false;
  $('#net').innerHTML = `<div class="netwarn">${/permission/i.test(e?.code || e?.message || '') ? '파이어베이스 보안 규칙 때문에 읽지 못했어요. 안내서의 규칙을 붙여 넣어 주세요.' : '인터넷 연결을 확인하는 중이에요…'}</div>`;
}

function qrSvg(text) {
  try {
    const q = qrcode(0, 'L');
    q.addData(text);
    q.make();
    return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  } catch { return '<div class="err" style="width:220px">QR을 만들 수 없어요. 아래 링크를 폰으로 보내 주세요.</div>'; }
}

      ${st.settings ? '<button class="btn ghost" data-go="cancel">설정 그대로 두고 돌아가기</button>' : ''}
    </div>`;
  } else if (s === 'link') {
    h = `<div class="h" style="font-size:42px">이미 만든 칠판 연결하기</div>
      <div style="font-size:16px;line-height:1.6">칠판을 새로 켰거나 다른 컴퓨터로 옮겼을 때 써요.<br>리모컨 → 설정 → <b>'칠판 연결 주소 복사'</b>로 받은 주소를 붙여 넣어 주세요.</div>
      <textarea class="inp" id="linkIn" rows="4" placeholder="https://…#c=…"></textarea>
      <div class="err">${esc(wz.error)}</div>
      <div class="nav"><button class="btn ghost" data-go="0">← 처음으로</button><button class="btn main" data-go="linkOk">연결하기</button></div>`;
  } else if (s === 1) {
    h = `${stepsBar(1)}<div class="h" style="font-size:40px">① 파이어베이스 연결</div>
      <div class="help" style="font-size:15px">파이어베이스 콘솔 → 프로젝트 설정(톱니) → '내 앱'의 웹 앱 → <b>SDK 설정 및 구성</b>에서 <b>구성(Config)</b>을 골라 <code>firebaseConfig</code> 부분을 통째로 복사해 붙여 넣어 주세요. 자세한 순서는 함께 드린 안내서에 있어요.</div>
      <textarea class="inp" id="cfgIn" rows="8" placeholder='const firebaseConfig = {&#10;  apiKey: "…",&#10;  authDomain: "…",&#10;  projectId: "…",&#10;  …&#10;};'>${esc(wz.cfgText)}</textarea>
      <div class="${wz.error ? 'err' : 'ok'}" id="cfgMsg">${esc(wz.error)}</div>
      <div class="nav"><button class="btn ghost" data-go="0">← 처음으로</button><button class="btn main" data-go="cfgOk">다음 →</button></div>`;
  } else if (s === 2) {
    const r = wz.results;
    h = `${stepsBar(2)}<div class="h" style="font-size:40px">② 학교와 우리 반</div>
      <div style="display:flex;gap:8px"><input class="inp" id="schoolQ" style="flex:1" placeholder="학교 이름" value="${esc(wz.q || '')}"><button class="btn main" data-go="search">검색</button></div>
      ${r ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0">
        <div class="field"><label>컴시간 학교 <span class="help">(시간표)</span></label><div class="list" style="height:170px">${r.comci.length ? r.comci.map((x, i) => `<button class="opt ${wz.comci?.code === x.code ? 'on' : ''}" data-comci="${i}">${esc(x.name)} <span class="help">${esc(x.region)}</span></button>`).join('') : `<div class="opt help">${esc(r.errors?.comci || '검색 결과가 없어요')}</div>`}</div></div>
        <div class="field"><label>NEIS 학교 <span class="help">(급식·학사일정)</span></label><div class="list" style="height:170px">${r.neis.length ? r.neis.map((x, i) => `<button class="opt ${wz.neis?.code === x.code ? 'on' : ''}" data-neis="${i}">${esc(x.name)} <span class="help">${esc(x.region)} · ${esc(x.kind)}</span></button>`).join('') : `<div class="opt help">${esc(r.errors?.neis || '검색 결과가 없어요')}</div>`}</div></div>
      </div>` : '<div class="help">학교를 검색하면 컴시간(시간표)과 NEIS(급식·학사일정) 목록이 나와요. 이름이 같은 학교는 자동으로 골라 드려요.</div>'}
      <div style="display:flex;gap:12px;align-items:center;font-size:18px">
        <select class="inp" id="gradeIn">${[1, 2, 3, 4, 5, 6].map((g) => `<option ${g === wz.grade ? 'selected' : ''}>${g}</option>`).join('')}</select>학년
        <select class="inp" id="clsIn">${Array.from({ length: 20 }, (_, i) => i + 1).map((c) => `<option ${c === wz.cls ? 'selected' : ''}>${c}</option>`).join('')}</select>반
        <input class="inp" id="titleIn" style="margin-left:auto;width:260px" value="${esc(wz.title)}" aria-label="칠판 제목" placeholder="칠판 제목">
      </div>
      <details><summary class="help" style="cursor:pointer">고급: 중계 주소 바꾸기</summary>
        <input class="inp" id="relayIn" style="width:100%;margin-top:6px" placeholder="${esc(defaultRelay() || 'https://…/api')}" value="${esc(wz.relay)}">
        <div class="help">비워 두면 이 칠판이 올라가 있는 곳의 중계(${esc(defaultRelay() || '없음')})를 써요.</div></details>
      <div class="err">${esc(wz.error)}</div>
      <div class="nav"><button class="btn ghost" data-go="1">← 이전</button><button class="btn main" data-go="schoolOk">다음 →</button></div>`;
  } else if (s === 3) {
    const list = parseStudents(wz.studentsText);
    h = `${stepsBar(3)}<div class="h" style="font-size:40px">③ 학생 명단</div>
      <div class="help" style="font-size:15px">엑셀이나 나이스에서 <b>번호 · 이름</b> 두 칸을 복사해 붙여 넣어 주세요. 셋째 칸에 생일(예: 9/14)을 넣으면 아침 화면에 생일 축하가 떠요. 지금 건너뛰고 나중에 리모컨에서 넣어도 돼요.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0">
        <textarea class="inp" id="stuIn" rows="10" placeholder="1&#9;김채아&#9;9/14&#10;2&#9;이바다&#10;3&#9;박구름">${esc(wz.studentsText)}</textarea>
        <div class="list" style="padding:8px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;height:262px" id="stuPrev">${list.map((k) => `<span class="badge" style="background:#efe5f9;font-size:14px;padding:4px 10px">${k.no} ${esc(k.name)}${k.bday ? ` · ${esc(k.bday)}` : ''}</span>`).join('') || '<span class="help">미리보기가 여기에 나와요</span>'}</div>
      </div>
      <div class="help" id="stuCount">${list.length}명</div>
      <div class="nav"><button class="btn ghost" data-go="2">← 이전</button><button class="btn main" data-go="save">설정 마치기 →</button></div>`;
  } else if (s === 4) {
    h = `${stepsBar(4)}<div class="h" style="font-size:40px">④ 저장하는 중…</div><div class="help">파이어베이스에 우리 반 칠판을 만들고 있어요.</div><div class="err">${esc(wz.error)}</div>
      ${wz.error ? '<div class="nav"><button class="btn ghost" data-go="3">← 이전</button><button class="btn main" data-go="save">다시 시도</button></div>' : ''}`;
  } else if (s === 5) {
    const url = remoteUrl(st.conn);
    h = `${stepsBar(5)}<div style="display:flex;gap:28px;align-items:center">
      <div class="qrbox">${qrSvg(url)}</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="h" style="font-size:42px">다 됐어요!</div>
        <div style="font-size:17px;line-height:1.6">이제 <b>선생님 폰 카메라로 QR</b>을 찍으면 리모컨이 열려요.<br>폰에서는 아무것도 입력하지 않아도 돼요.</div>
        <div class="help">QR은 나중에 왼쪽 아래 톱니 → '리모컨 연결'에서 다시 볼 수 있어요.<br>이 QR에는 칠판 연결 정보가 들어 있으니 학생이 찍지 않게 해 주세요.</div>
        <button class="btn main" data-go="finish" style="align-self:flex-start;font-size:20px">칠판 시작하기</button>
      </div></div>`;
  }
  $('#full').innerHTML = `<div class="full"><div class="sheet">${h}</div></div>`;
  if (s === 3) $('#stuIn').addEventListener('input', (e) => {
    wz.studentsText = e.target.value;
    const list = parseStudents(wz.studentsText);
    $('#stuPrev').innerHTML = list.map((k) => `<span class="badge" style="background:#efe5f9;font-size:14px;padding:4px 10px">${k.no} ${esc(k.name)}${k.bday ? ` · ${esc(k.bday)}` : ''}</span>`).join('') || '<span class="help">미리보기가 여기에 나와요</span>';
    $('#stuCount').textContent = `${list.length}명`;
  });
  if (s === 2) $('#schoolQ').addEventListener('keydown', (e) => { if (e.key === 'Enter') wzAct('search'); });
}
function keepStep2() {
  if (!$('#gradeIn')) return;
  wz.grade = Number($('#gradeIn').value); wz.cls = Number($('#clsIn').value);
  wz.title = $('#titleIn').value.trim() || '우리 반 칠판';
  wz.relay = $('#relayIn').value.trim(); wz.q = $('#schoolQ').value.trim();
}
$('#full').addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  const c = e.target.closest('[data-comci]');
  const n = e.target.closest('[data-neis]');
  if (c) { keepStep2(); wz.comci = wz.results.comci[Number(c.dataset.comci)]; autoMatchNeis(); drawWizard(); return; }
  if (n) { keepStep2(); wz.neis = wz.results.neis[Number(n.dataset.neis)]; drawWizard(); return; }
  if (go) wzAct(go.dataset.go);
});
function norm(x) { return String(x || '').replace(/\s/g, '').replace(/학교$/, ''); }
function autoMatchNeis() {
  if (!wz.results || !wz.comci) return;
  const m = wz.results.neis.filter((x) => norm(x.name) === norm(wz.comci.name) || norm(x.name).startsWith(norm(wz.comci.name)));
  if (m.length === 1 || (m.length && !wz.neis)) wz.neis = m[0];
}
async function wzAct(go) {
  wz.error = '';
  if (go === '0' || go === '1' || go === '2' || go === '3' || go === 'link') {
    if (wz.step === 2) keepStep2();
    if (wz.step === 3 && $('#stuIn')) wz.studentsText = $('#stuIn').value;
    wz.step = isNaN(Number(go)) ? go : Number(go);
    drawWizard(); return;
  }
  if (go === 'cancel') { $('#full').innerHTML = ''; return; }
  if (go === 'demo') { startDemo(); return; }
  if (go === 'linkOk') {
    const txt = $('#linkIn').value.trim();
    const m = /[#&]c=([^&\s]+)/.exec(txt);
    const conn = m ? decodeLink(m[1]) : null;
    if (!conn?.cfg || !conn?.classId) { wz.error = '주소를 읽을 수 없어요. 리모컨 설정에서 복사한 주소를 그대로 붙여 넣어 주세요.'; drawWizard(); return; }
    saveLocal(conn); location.hash = ''; location.reload(); return;
  }
  if (go === 'cfgOk') {
    wz.cfgText = $('#cfgIn').value;
    const cfg = parseFirebaseConfig(wz.cfgText);
    if (!cfg) { wz.error = 'apiKey · projectId · appId를 찾지 못했어요. firebaseConfig 부분을 통째로 붙여 넣어 주세요.'; drawWizard(); return; }
    wz.cfg = cfg; wz.step = 2; drawWizard(); return;
  }
  if (go === 'search') {
    keepStep2();
    if (wz.q.length < 2) { wz.error = '학교 이름을 두 글자 이상 적어 주세요.'; drawWizard(); return; }
    $('.nav .btn.main') && ($('.nav .btn.main').disabled = true);
    try {
      wz.results = await relay(wz.relay, 'search', { q: wz.q });
      wz.comci = wz.results.comci.length === 1 ? wz.results.comci[0] : wz.results.comci.find((x) => norm(x.name) === norm(wz.q)) || null;
      wz.neis = null;
      autoMatchNeis();
      if (!wz.neis && wz.results.neis.length === 1) wz.neis = wz.results.neis[0];
    } catch (err) { wz.error = `검색하지 못했어요: ${err.message}. 중계 주소를 확인해 주세요.`; }
    drawWizard(); return;
  }
  if (go === 'schoolOk') {
    keepStep2();
    if (!wz.comci && !wz.neis) { wz.error = '학교를 검색해서 골라 주세요.'; drawWizard(); return; }
    wz.step = 3; drawWizard(); return;
  }
  if (go === 'save') {
    if ($('#stuIn')) wz.studentsText = $('#stuIn').value;
    wz.step = 4; drawWizard();
    try {
      const classId = st.conn && !st.conn.demo && st.conn.cfg?.projectId === wz.cfg.projectId ? st.conn.classId : randomId(20);
      const store = await connectFirebase(wz.cfg, classId);
      const settings = {
        ...(st.settings && !st.conn?.demo ? {} : defaultSettings()),
        title: wz.title,
        grade: wz.grade, cls: wz.cls, relay: wz.relay,
        school: {
          name: wz.neis?.name || wz.comci?.name || '', comci: wz.comci?.code || null,
          atpt: wz.neis?.atpt || null, neis: wz.neis?.code || null, kind: wz.neis?.kind || '중학교', region: wz.neis?.region || wz.comci?.region || ''
        },
        students: parseStudents(wz.studentsText),
        auto: { ...(st.settings?.auto || defaultSettings().auto), classMins: wz.neis?.kind === '고등학교' ? 50 : wz.neis?.kind === '초등학교' ? 40 : 45 }
      };
      await withTimeout(store.init(settings, defaultLive()), 15000);
      st.conn = { cfg: wz.cfg, classId };
      saveLocal(st.conn);
      st.store?.close?.();
      startStore(store);
      wz.step = 5; drawWizard();
    } catch (err) {
      const msg = String(err?.code || err?.message || err);
      wz.error = /permission/i.test(msg)
        ? '파이어베이스가 저장을 막았어요. Firestore 데이터베이스를 만들고, 안내서의 보안 규칙을 붙여 넣은 뒤 다시 시도해 주세요.'
        : /timeout/i.test(msg)
          ? '응답이 없어요. Firestore 데이터베이스를 만들었는지, 인터넷이 연결됐는지 확인해 주세요.'
          : `저장하지 못했어요: ${msg}`;
      drawWizard();
    }
    return;
  }
  if (go === 'finish') { $('#full').innerHTML = ''; showSplash(); }
}
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}

/* ================= 시작 화면(소리 켜기) ================= */
function showSplash() {
  $('#full').innerHTML = `<div class="full splash" id="splash">
    <span class="pen" style="font-size:64px;line-height:1">${esc(st.settings?.title || '우리 반 칠판')}</span>
    <div style="font-size:20px">화면을 한 번 눌러 주세요</div>
    <div class="help" style="font-size:15px">브라우저는 한 번 눌러야 호출 소리를 낼 수 있어요. 아침에 칠판을 켤 때 한 번만 눌러 주면 돼요.</div></div>`;
  $('#splash').addEventListener('click', () => {
    unlockAudio();
    if (!sharedDemo()) document.documentElement.requestFullscreen?.().catch(() => {});
    $('#full').innerHTML = '';
  }, { once: true });
}

/* ================= 체험 모드 ================= */
function startDemo() {
  const { settings, live } = demoData();
  st.conn = { demo: true };
  st.tt = {
    source: 'demo', times: ['09:00', '09:55', '10:50', '11:45', '13:30', '14:25', '15:20'],
    days: [['국어', '수학', '영어', '과학', '음악', '도덕', '창체'], ['수학', '영어', '국어', '체육', '사회', '미술', ''], ['영어', '과학', '수학', '국어', '체육', '기가', '동아리'], ['사회', '국어', '과학', '수학', '영어', '음악', ''], ['과학', '체육', '국어', '영어', '수학', '도덕', '자율']]
      .map((d, di) => d.filter(Boolean).map((s, i) => ({ p: i + 1, subject: s, teacher: '', room: s === '과학' ? '과학실' : '', changed: di === new Date().getDay() - 1 && i === 4, before: '체육' })))
  };
  st.meal = { menu: ['흑미밥', '소고기미역국', '닭갈비', '계란말이', '배추김치', '귤'] };
  st.sched = [{ date: ymd(weekMonday()), name: '진로 상담 주간' }];
  st.weather = { code: 0, temp: 14, text: '맑음', air: airGrade(20, 10) };
  $('#full').innerHTML = '';
  window.__uribanDemoMode = true;
  const shared = sharedDemo();
  startStore(shared || demoStore(settings, live));
  if (!shared) toggleDemoPanel(true);
  showSplash();
}
function toggleDemoPanel(force) {
  if ($('#demo').innerHTML && force !== true) { $('#demo').innerHTML = ''; return; }
  $('#demo').innerHTML = `<div class="demo"><b>체험 조작판 (실제로는 리모컨에서 해요)</b>
    <button data-d="call">호출 보내기</button><button data-d="callMsg">문장 호출</button><button data-d="timer">타이머 1분</button>
    <button data-d="pick">랜덤 뽑기</button><button data-d="noise">소음 신호등</button>
    <button data-d="check">통신문 체크</button><button data-d="close">덮개·체크 닫기</button>
    <button data-d="star">칭찬 별 +1</button><button data-d="auto">자동 화면 바꾸기</button></div>`;
}
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const AUTO_CYCLE = [() => null, () => ({ phase: 'morning', next: 0, at: nowMin() + 12 }), () => ({ phase: 'break', next: 3, at: nowMin() + 7, lunch: false }), () => ({ phase: 'closing', end: nowMin() + 30 })];
let autoIdx = 0;
$('#demo').addEventListener('click', (e) => {
  const d = e.target.dataset.d;
  if (!d) return;
  unlockAudio();
  const kids = st.settings.students;
  const u = (p) => st.store.update(p);
  if (d === 'callMsg') u({ call: { id: randomId(8), names: [kids[1].name, kids[4].name], place: null, message: '점심시간에 교무실 들러 주세요', sound: 'voice', from: '채쌤', at: NOW, ack: false } });
  if (d === 'call') u({ call: { id: randomId(8), names: [kids[0].name], place: '교무실', sound: 'voice', from: '채쌤', at: NOW, ack: false } });
  if (d === 'timer') u({ overlay: { type: 'timer', id: randomId(8), label: '모둠 토의', durationMs: 60000, startedAt: NOW } });
  if (d === 'pick') pickOne('오늘의 발표자');
  if (d === 'noise') u({ overlay: { type: 'noise', id: randomId(8), label: '자습 시간', sens: 3 } });
  if (d === 'check') u({ check: { id: randomId(8), title: '가정통신문 제출했으면 내 이름 꾹!', stamp: '완료', kind: 'custom', date: todayKey(), done: { 1: true, 3: true, 5: true, 6: true, 8: true }, startedAt: NOW } });
  if (d === 'close') u({ overlay: null, call: null, check: null });
  if (d === 'star') u({ 'stars.count': inc(1) });
  if (d === 'auto') setAuto((autoIdx + 1) % AUTO_CYCLE.length);
});
function setAuto(i) {
  autoIdx = i;
  st.forcePhase = AUTO_CYCLE[i]();
  const u = (p) => st.store.update(p);
  if (st.forcePhase?.phase === 'morning') u({ check: { id: randomId(8), title: '등교했으면 내 이름 꾹!', stamp: '등교', kind: 'attendance', date: todayKey(), done: { 2: true, 4: true, 7: true }, startedAt: NOW } });
  else if (st.live.check?.kind === 'attendance') u({ check: null });
  toast(['평소 화면', '아침 등교 시간 화면', '쉬는 시간 화면', '종례 시간 화면'][i]);
  renderAll();
}
window.__setAuto = setAuto;

/* ================= 시작 ================= */
(function boot() {
  const fromHash = connFromHash();
  if (fromHash?.cfg && fromHash?.classId) { saveLocal(fromHash); history.replaceState(null, '', location.pathname); }
  if (location.search.includes('demo') || sharedDemo()) { startDemo(); return; }
  const conn = loadLocal();
  if (conn?.cfg && conn?.classId) {
    st.conn = conn;
    connectFirebase(conn.cfg, conn.classId).then((store) => { startStore(store); showSplash(); })
      .catch((e) => { netError(e); toast('파이어베이스에 연결하지 못했어요. 인터넷을 확인해 주세요.'); });
  } else {
    openWizard();
  }
})();
</script>
